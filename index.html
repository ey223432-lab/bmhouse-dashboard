function uid() {
  return 'x' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}

function deepClone(x) { return JSON.parse(JSON.stringify(x)); }

function mapTree(nodes, id, fn) {
  return nodes.map((n) => {
    if (n.id === id) return fn(n);
    if (n.children && n.children.length) {
      return { ...n, children: mapTree(n.children, id, fn) };
    }
    return n;
  });
}

function removeFromTree(nodes, id) {
  return nodes
    .filter((n) => n.id !== id)
    .map((n) =>
      n.children && n.children.length
        ? { ...n, children: removeFromTree(n.children, id) }
        : n
    );
}

function addChildToTree(nodes, parentId, child) {
  return nodes.map((n) => {
    if (n.id === parentId) {
      return { ...n, children: [...(n.children || []), child] };
    }
    if (n.children && n.children.length) {
      return { ...n, children: addChildToTree(n.children, parentId, child) };
    }
    return n;
  });
}

function collectIds(nodes, acc) {
  nodes.forEach((n) => {
    acc.push(n.id);
    if (n.children && n.children.length) collectIds(n.children, acc);
  });
  return acc;
}

function countProgress(nodes) {
  let total = 0;
  let done = 0;
  const walk = (list) => {
    list.forEach((n) => {
      total += 1;
      if (n.status === 'done') done += 1;
      if (n.children && n.children.length) walk(n.children);
    });
  };
  walk(nodes);
  return { total, done };
}

function nodeMatches(node, q) {
  if (!q) return true;
  const hay = (node.text || '') + ' ' + (node.memo || '');
  if (hay.toLowerCase().includes(q)) return true;
  if (node.children) return node.children.some((c) => nodeMatches(c, q));
  return false;
}

function formatRelative(ts) {
  if (!ts) return '';
  const diff = Math.max(0, Date.now() - ts);
  const min = Math.floor(diff / 60000);
  if (min < 1) return '방금 전';
  if (min < 60) return min + '분 전';
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + '시간 전';
  const day = Math.floor(hr / 24);
  return day + '일 전';
}

function StatusIcon({ status, size = 18 }) {
  if (status === 'done') return <CheckCircle2 size={size} color={C.sage} strokeWidth={2.2} />;
  if (status === 'doing') return <CircleDot size={size} color={C.gold} strokeWidth={2.2} />;
  return <Circle size={size} color={C.inkFaint} strokeWidth={2} />;
}

function nextStatus(s) {
  if (s === 'todo') return 'doing';
  if (s === 'doing') return 'done';
  return 'todo';
}

function ProgressBar({ done, total, color }) {
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
      <div style={{ flex: 1, height: 6, borderRadius: 999, background: C.borderSoft, overflow: 'hidden' }}>
        <div style={{ width: pct + '%', height: '100%', background: color || C.coral, borderRadius: 999, transition: 'width .4s ease' }} />
      </div>
      <span style={{ fontSize: 11, color: C.inkSoft, fontVariantNumeric: 'tabular-nums', minWidth: 30, textAlign: 'right' }}>{pct}%</span>
    </div>
  );
}

function TreeNode({
  node, depth, showStatus, expandedIds, toggleExpand,
  onEditText, onEditMemo, onCycleStatus, onAddChild, onDelete, query,
}) {
  const [editing, setEditing] = useState(false);
  const [memoOpen, setMemoOpen] = useState(!!node.memo);
  const [confirmDel, setConfirmDel] = useState(false);
  const inputRef = useRef(null);
  const memoRef = useRef(null);
  const delTimer = useRef(null);

  useEffect(() => {
    if (editing && inputRef.current) {
      inputRef.current.focus();
      inputRef.current.select();
    }
  }, [editing]);

  useEffect(() => () => { if (delTimer.current) clearTimeout(delTimer.current); }, []);

  if (query && !nodeMatches(node, query)) return null;

  const hasChildren = node.children && node.children.length > 0;
  const expanded = expandedIds.has(node.id);
  const isEmpty = !node.text;

  const commitText = () => {
    const val = inputRef.current ? inputRef.current.value : node.text;
    onEditText(node.id, val.trim());
    setEditing(false);
  };

  const commitMemo = () => {
    const val = memoRef.current ? memoRef.current.value : node.memo;
    onEditMemo(node.id, val);
  };

  const startDelete = () => {
    if (!confirmDel) {
      setConfirmDel(true);
      delTimer.current = setTimeout(() => setConfirmDel(false), 3000);
      return;
    }
    if (delTimer.current) clearTimeout(delTimer.current);
    onDelete(node.id);
  };

  return (
    <div style={{ marginLeft: depth === 0 ? 0 : 18 }}>
      <div
        className="node-row"
        style={{
          display: 'flex', alignItems: 'flex-start', gap: 6, padding: '6px 6px',
          borderRadius: 8, position: 'relative',
        }}
      >
        <button
          onClick={() => hasChildren && toggleExpand(node.id)}
          style={{
            width: 18, height: 24, display: 'flex', alignItems: 'center', justifyContent: 'center',
            background: 'none', border: 'none', cursor: hasChildren ? 'pointer' : 'default',
            color: C.inkFaint, flexShrink: 0, marginTop: 1,
          }}
        >
          {hasChildren ? (expanded ? <ChevronDown size={14} /> : <ChevronRight size={14} />) : null}
        </button>

        {showStatus && (
          <button
            onClick={() => onCycleStatus(node.id)}
            title="상태 변경"
            style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 2, marginTop: 1, flexShrink: 0 }}
          >
            <StatusIcon status={node.status} />
          </button>
        )}

        <div style={{ flex: 1, minWidth: 0 }}>
          {editing ? (
            <input
              ref={inputRef}
              defaultValue={node.text}
              onBlur={commitText}
              onKeyDown={(e) => {
                if (e.key === 'Enter') { e.preventDefault(); commitText(); }
                if (e.key === 'Escape') { e.preventDefault(); setEditing(false); }
              }}
              style={{
                width: '100%', font: 'inherit', fontSize: depth === 0 ? 15 : 14,
                border: 'none', borderBottom: '1.5px solid ' + C.coral, background: 'transparent',
                outline: 'none', padding: '2px 0', color: C.ink,
              }}
            />
          ) : (
            <div
              onClick={() => setEditing(true)}
              style={{
                cursor: 'text', fontSize: depth === 0 ? 15 : 14,
                fontWeight: depth === 0 ? 600 : 400,
                lineHeight: 1.55,
                color: isEmpty ? C.inkFaint : (node.status === 'done' ? C.inkSoft : C.ink),
                fontStyle: isEmpty ? 'italic' : 'normal',
                textDecoration: node.status === 'done' && showStatus ? 'line-through' : 'none',
                textDecorationColor: C.inkFaint,
                wordBreak: 'break-word',
                padding: '2px 0',
              }}
            >
              {isEmpty ? '내용을 입력하세요…' : node.text}
            </div>
          )}

          {memoOpen && (
            <div style={{ marginTop: 4, marginBottom: 2 }}>
              <textarea
                ref={memoRef}
                defaultValue={node.memo}
                placeholder="메모를 기록해보세요…"
                onBlur={commitMemo}
                rows={2}
                style={{
                  width: '100%', fontSize: 12.5, fontFamily: 'inherit', color: C.ink,
                  background: C.goldSoft, border: '1px solid ' + C.borderSoft, borderRadius: 8,
                  padding: '6px 8px', outline: 'none', resize: 'vertical', lineHeight: 1.5,
                }}
              />
            </div>
          )}
        </div>

        <div className="node-actions" style={{ display: 'flex', gap: 2, flexShrink: 0, marginTop: 1 }}>
          <button
            onClick={() => setMemoOpen((v) => !v)}
            title="메모"
            style={{
              background: 'none', border: 'none', cursor: 'pointer', padding: 4, borderRadius: 6,
              color: node.memo ? C.gold : C.inkFaint,
            }}
          >
            <StickyNote size={13} />
          </button>
          <button
            onClick={() => onAddChild(node.id)}
            title="하위 항목 추가"
            style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4, borderRadius: 6, color: C.inkFaint }}
          >
            <Plus size={13} />
          </button>
          <button
            onClick={startDelete}
            title={confirmDel ? '다시 누르면 삭제됩니다' : '삭제'}
            style={{
              background: confirmDel ? C.coralSoft : 'none', border: 'none', cursor: 'pointer',
              padding: 4, borderRadius: 6, color: confirmDel ? C.coral : C.inkFaint,
            }}
          >
            <Trash2 size={13} />
          </button>
        </div>
      </div>

      {hasChildren && expanded && (
        <div style={{ borderLeft: '1px solid ' + C.borderSoft, marginLeft: 9 }}>
          {node.children.map((child) => (
            <TreeNode
              key={child.id}
              node={child}
              depth={depth + 1}
              showStatus={showStatus}
              expandedIds={expandedIds}
              toggleExpand={toggleExpand}
              onEditText={onEditText}
              onEditMemo={onEditMemo}
              onCycleStatus={onCycleStatus}
              onAddChild={onAddChild}
              onDelete={onDelete}
              query={query}
            />
          ))}
        </div>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  목록 화면 — 최상위 제목 카드만 표시                                 */

function ListCard({ node, accent, showStatus, onOpen }) {
  const { total, done } = countProgress(node.children && node.children.length ? node.children : [node]);
  const childCount = node.children ? node.children.length : 0;

  return (
    <button
      onClick={() => onOpen(node.id)}
      style={{
        display: 'flex', alignItems: 'center', gap: 12, width: '100%', textAlign: 'left',
        background: C.card, border: '1px solid ' + C.border, borderRadius: 14,
        padding: '15px 14px', cursor: 'pointer',
      }}
      className="list-card"
    >
      <div style={{ width: 4, alignSelf: 'stretch', minHeight: 30, borderRadius: 999, background: accent, flexShrink: 0 }} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{
          fontSize: 15.5, fontWeight: 600, color: C.ink, lineHeight: 1.4,
          wordBreak: 'break-word',
        }}>
          {node.text || '내용을 입력하세요…'}
        </div>
        <div style={{ fontSize: 11.5, color: C.inkFaint, marginTop: 3 }}>
          하위 항목 {childCount}개
        </div>
        {showStatus && total > 0 && (
          <div style={{ marginTop: 8 }}>
            <ProgressBar done={done} total={total} color={accent} />
          </div>
        )}
      </div>
      <ChevronRight size={18} color={C.inkFaint} style={{ flexShrink: 0 }} />
    </button>
  );
}

function DetailView({
  node, showStatus, expandedIds, toggleExpand,
  onEditText, onEditMemo, onCycleStatus, onAddChild, onDelete, onBack, accent,
}) {
  const [query, setQuery] = useState('');
  const [titleEditing, setTitleEditing] = useState(false);
  const [memoOpen, setMemoOpen] = useState(!!node.memo);
  const titleRef = useRef(null);
  const memoRef = useRef(null);
  const q = query.trim().toLowerCase();

  useEffect(() => {
    if (titleEditing && titleRef.current) { titleRef.current.focus(); titleRef.current.select(); }
  }, [titleEditing]);

  const commitTitle = () => {
    const val = titleRef.current ? titleRef.current.value : node.text;
    onEditText(node.id, val.trim());
    setTitleEditing(false);
  };
  const commitMemo = () => {
    const val = memoRef.current ? memoRef.current.value : node.memo;
    onEditMemo(node.id, val);
  };

  const { total, done } = countProgress(node.children || []);
  const children = node.children || [];

  return (
    <div>
      <button
        onClick={onBack}
        style={{
          display: 'flex', alignItems: 'center', gap: 4, background: 'none', border: 'none',
          cursor: 'pointer', color: C.inkSoft, fontSize: 13, padding: '4px 2px', marginBottom: 12,
        }}
      >
        <ChevronLeft size={16} /> 목록으로
      </button>

      <div style={{ background: C.card, border: '1px solid ' + C.border, borderRadius: 14, padding: '16px 16px 12px', marginBottom: 14 }}>
        <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
          <div style={{ width: 4, alignSelf: 'stretch', minHeight: 24, borderRadius: 999, background: accent, marginTop: 3, flexShrink: 0 }} />
          {showStatus && (
            <button
              onClick={() => onCycleStatus(node.id)}
              title="상태 변경"
              style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 2, marginTop: 2, flexShrink: 0 }}
            >
              <StatusIcon status={node.status} size={20} />
            </button>
          )}
          <div style={{ flex: 1, minWidth: 0 }}>
            {titleEditing ? (
              <input
                ref={titleRef}
                defaultValue={node.text}
                onBlur={commitTitle}
                onKeyDown={(e) => {
                  if (e.key === 'Enter') { e.preventDefault(); commitTitle(); }
                  if (e.key === 'Escape') { e.preventDefault(); setTitleEditing(false); }
                }}
                style={{
                  width: '100%', fontFamily: "'Noto Serif KR', serif", fontWeight: 700, fontSize: 18,
                  border: 'none', borderBottom: '1.5px solid ' + C.coral, background: 'transparent',
                  outline: 'none', padding: '2px 0', color: C.ink,
                }}
              />
            ) : (
              <h2
                onClick={() => setTitleEditing(true)}
                style={{
                  fontFamily: "'Noto Serif KR', serif", fontWeight: 700, fontSize: 18, margin: 0,
                  color: C.ink, lineHeight: 1.4, cursor: 'text', wordBreak: 'break-word',
                }}
              >
                {node.text || '내용을 입력하세요…'}
              </h2>
            )}
            {memoOpen && (
              <div style={{ marginTop: 8 }}>
                <textarea
                  ref={memoRef}
                  defaultValue={node.memo}
                  placeholder="이 카테고리에 대한 메모를 기록해보세요…"
                  onBlur={commitMemo}
                  rows={2}
                  style={{
                    width: '100%', fontSize: 12.5, fontFamily: 'inherit', color: C.ink,
                    background: C.goldSoft, border: '1px solid ' + C.borderSoft, borderRadius: 8,
                    padding: '6px 8px', outline: 'none', resize: 'vertical', lineHeight: 1.5,
                  }}
                />
              </div>
            )}
          </div>
          <button
            onClick={() => setMemoOpen((v) => !v)}
            title="메모"
            style={{
              background: 'none', border: 'none', cursor: 'pointer', padding: 4, borderRadius: 6,
              color: node.memo ? C.gold : C.inkFaint, flexShrink: 0,
            }}
          >
            <StickyNote size={15} />
          </button>
        </div>

        {showStatus && total > 0 && (
          <div style={{ marginTop: 12, paddingLeft: 14 }}>
            <ProgressBar done={done} total={total} color={accent} />
          </div>
        )}
      </div>

      {children.length > 3 && (
        <div style={{ position: 'relative', marginBottom: 12 }}>
          <Search size={14} color={C.inkFaint} style={{ position: 'absolute', left: 11, top: 11 }} />
          <input
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder="이 안에서 검색"
            style={{
              width: '100%', padding: '9px 10px 9px 32px', borderRadius: 10,
              border: '1px solid ' + C.border, background: C.card, fontSize: 13, outline: 'none', color: C.ink,
            }}
          />
        </div>
      )}

      <div style={{ background: C.card, border: '1px solid ' + C.border, borderRadius: 14, padding: '10px 14px' }}>
        {children.length === 0 ? (
          <div style={{ fontSize: 13, color: C.inkFaint, padding: '10px 4px', fontStyle: 'italic' }}>
            아직 하위 항목이 없어요. 아래 버튼으로 추가해보세요.
          </div>
        ) : (
          children.map((child) => (
            <TreeNode
              key={child.id}
              node={child}
              depth={0}
              showStatus={showStatus}
              expandedIds={expandedIds}
              toggleExpand={toggleExpand}
              onEditText={onEditText}
              onEditMemo={onEditMemo}
              onCycleStatus={onCycleStatus}
              onAddChild={onAddChild}
              onDelete={onDelete}
              query={q}
            />
          ))
        )}
      </div>

      <button
        onClick={() => onAddChild(node.id)}
        style={{
          display: 'flex', alignItems: 'center', gap: 6, marginTop: 10, padding: '9px 12px', borderRadius: 9,
          border: '1px dashed ' + C.border, background: 'transparent', cursor: 'pointer', width: '100%',
          justifyContent: 'center', fontSize: 12.5, color: C.inkSoft, fontWeight: 500,
        }}
      >
        <Plus size={14} /> 하위 항목 추가
      </button>
    </div>
  );
}

function CategoryCard({
  node, accent, showStatus, expandedIds, toggleExpand,
  onEditText, onEditMemo, onCycleStatus, onAddChild, onDelete, query,
}) {
  if (query && !nodeMatches(node, query)) return null;
  const { total, done } = countProgress(node.children && node.children.length ? node.children : [node]);

  return (
    <div
      style={{
        background: C.card, border: '1px solid ' + C.border, borderRadius: 14,
        padding: '14px 14px 8px', boxShadow: '0 1px 2px rgba(44,38,32,0.04)',
      }}
    >
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 8, marginBottom: showStatus ? 8 : 2 }}>
        <div style={{ width: 3, alignSelf: 'stretch', minHeight: 18, borderRadius: 999, background: accent, marginTop: 3 }} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <TreeNode
            node={node}
            depth={0}
            showStatus={showStatus}
            expandedIds={expandedIds}
            toggleExpand={toggleExpand}
            onEditText={onEditText}
            onEditMemo={onEditMemo}
            onCycleStatus={onCycleStatus}
            onAddChild={onAddChild}
            onDelete={onDelete}
            query={query}
          />
        </div>
      </div>
      {showStatus && total > 0 && (
        <div style={{ padding: '2px 6px 8px 20px' }}>
          <ProgressBar done={done} total={total} color={accent} />
        </div>
      )}
    </div>
  );
}

function SectionBlock({
  title, icon, tree, sectionKey, showStatus, accentOffset, inline,
  onOpen, onAddTop, onReset, resetConfirm, setResetConfirm, query,
  expandedIds, toggleExpand, onEditText, onEditMemo, onCycleStatus, onAddChild, onDelete,
}) {
  const q = query.trim().toLowerCase();
  const overall = showStatus ? countProgress(tree) : null;
  const visible = tree
    .map((node, i) => ({ node, i }))
    .filter(({ node }) => !q || nodeMatches(node, q));

  return (
    <div style={{ marginBottom: 26 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
        <div style={{
          width: 26, height: 26, borderRadius: 8, background: C.bgSoft,
          display: 'flex', alignItems: 'center', justifyContent: 'center', color: C.coral, flexShrink: 0,
        }}>
          {icon}
        </div>
        <h2 style={{
          fontFamily: "'Noto Serif KR', serif", fontWeight: 700, fontSize: 16.5,
          margin: 0, color: C.ink,
        }}>
          {title}
        </h2>
      </div>

      {showStatus && overall && overall.total > 0 && (
        <div style={{ background: C.card, border: '1px solid ' + C.border, borderRadius: 12, padding: '11px 14px', marginBottom: 10 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11.5, color: C.inkSoft, marginBottom: 5 }}>
            <span>전체 진행률</span>
            <span>{overall.done} / {overall.total}</span>
          </div>
          <ProgressBar done={overall.done} total={overall.total} color={C.coral} />
        </div>
      )}

      <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
        {inline
          ? visible.map(({ node, i }) => (
              <CategoryCard
                key={node.id}
                node={node}
                accent={ACCENTS[(i + accentOffset) % ACCENTS.length]}
                showStatus={showStatus}
                expandedIds={expandedIds}
                toggleExpand={toggleExpand}
                onEditText={onEditText}
                onEditMemo={onEditMemo}
                onCycleStatus={onCycleStatus}
                onAddChild={onAddChild}
                onDelete={onDelete}
                query={q}
              />
            ))
          : visible.map(({ node, i }) => (
              <ListCard
                key={node.id}
                node={node}
                accent={ACCENTS[(i + accentOffset) % ACCENTS.length]}
                showStatus={showStatus}
                onOpen={(id) => onOpen(sectionKey, id)}
              />
            ))}
        {tree.length > 0 && q && visible.length === 0 && (
          <div style={{ fontSize: 12.5, color: C.inkFaint, padding: '14px 4px', textAlign: 'center', fontStyle: 'italic' }}>
            검색 결과가 없어요.
          </div>
        )}
      </div>

      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 10 }}>
        <button
          className="top-add-btn"
          onClick={() => onAddTop(sectionKey)}
          style={{
            display: 'flex', alignItems: 'center', gap: 6, padding: '7px 11px', borderRadius: 9,
            border: '1px dashed ' + C.border, background: 'transparent', cursor: 'pointer',
            fontSize: 12, color: C.inkSoft, fontWeight: 500,
          }}
        >
          <Plus size={13} /> {sectionKey === 'mission' ? '새 가치 항목 추가' : '새 실행 카테고리 추가'}
        </button>

        {resetConfirm === sectionKey ? (
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 11, color: C.inkSoft }}>
            되돌릴까요?
            <button onClick={() => onReset(sectionKey)} style={{ background: C.coralSoft, color: C.coral, border: 'none', borderRadius: 6, padding: '4px 7px', cursor: 'pointer', fontSize: 11, display: 'flex', alignItems: 'center', gap: 3 }}>
              <Check size={11} /> 확인
            </button>
            <button onClick={() => setResetConfirm(null)} style={{ background: 'none', color: C.inkFaint, border: 'none', borderRadius: 6, padding: '4px 7px', cursor: 'pointer', fontSize: 11, display: 'flex', alignItems: 'center', gap: 3 }}>
              <X size={11} /> 취소
            </button>
          </div>
        ) : (
          <button
            onClick={() => setResetConfirm(sectionKey)}
            style={{ display: 'flex', alignItems: 'center', gap: 4, background: 'none', border: 'none', cursor: 'pointer', fontSize: 11, color: C.inkFaint, padding: '5px 4px' }}
          >
            <RotateCcw size={11} /> 원본으로 되돌리기
          </button>
        )}
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState('list'); // 'list' | 'detail'
  const [activeSection, setActiveSection] = useState(null); // 'mission' | 'exec'
  const [activeId, setActiveId] = useState(null);
  const [missionTree, setMissionTree] = useState(null);
  const [execTree, setExecTree] = useState(null);
  const [expandedIds, setExpandedIds] = useState(new Set());
  const [query, setQuery] = useState('');
  const [loaded, setLoaded] = useState(false);
  const [saveState, setSaveState] = useState('idle');
  const [lastSaved, setLastSaved] = useState(null);
  const [resetConfirm, setResetConfirm] = useState(null);
  const saveTimer = useRef(null);

  useEffect(() => {
    (async () => {
      let m = MISSION_SEED;
      let e = EXEC_SEED;
      let ts = null;
      try {
        const r = await Storage.get('bmhouse-mission-tree');
        if (r && r.value) m = JSON.parse(r.value);
      } catch (err) { /* 첫 방문: 시드 데이터 사용 */ }
      try {
        const r = await Storage.get('bmhouse-exec-tree');
        if (r && r.value) e = JSON.parse(r.value);
      } catch (err) { /* 첫 방문: 시드 데이터 사용 */ }
      try {
        const r = await Storage.get('bmhouse-last-updated');
        if (r && r.value) ts = Number(r.value);
      } catch (err) { /* no-op */ }

      setMissionTree(m);
      setExecTree(e);
      setLastSaved(ts);

      const ids = [];
      collectIds(m, ids);
      collectIds(e, ids);
      setExpandedIds(new Set(ids));
      setLoaded(true);
    })();
  }, []);

  const persist = useCallback((mTree, eTree) => {
    setSaveState('saving');
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await Storage.set('bmhouse-mission-tree', JSON.stringify(mTree));
        await Storage.set('bmhouse-exec-tree', JSON.stringify(eTree));
        const now = Date.now();
        await Storage.set('bmhouse-last-updated', String(now));
        setLastSaved(now);
        setSaveState('saved');
      } catch (err) {
        setSaveState('error');
      }
    }, 500);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    persist(missionTree, execTree);
  }, [missionTree, execTree, loaded, persist]);

  const treeFor = (section) => (section === 'mission' ? missionTree : execTree);
  const setTreeFor = (section, updater) => {
    if (section === 'mission') setMissionTree(updater);
    else setExecTree(updater);
  };

  const toggleExpand = (id) => {
    setExpandedIds((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };

  const onEditText = (section, id, text) => setTreeFor(section, (prev) => mapTree(prev, id, (n) => ({ ...n, text })));
  const onEditMemo = (section, id, memo) => setTreeFor(section, (prev) => mapTree(prev, id, (n) => ({ ...n, memo })));
  const onCycleStatus = (section, id) => setTreeFor(section, (prev) => mapTree(prev, id, (n) => ({ ...n, status: nextStatus(n.status) })));
  const onDelete = (section, id) => {
    setTreeFor(section, (prev) => removeFromTree(prev, id));
    if (section === activeSection && id === activeId) { setView('list'); setActiveId(null); setActiveSection(null); }
  };
  const onAddChild = (section, parentId) => {
    const child = { id: uid(), text: '', status: 'todo', memo: '', children: [] };
    setTreeFor(section, (prev) => addChildToTree(prev, parentId, child));
    setExpandedIds((prev) => new Set(prev).add(parentId).add(child.id));
  };
  const onAddTop = (section) => {
    const node = { id: uid(), text: '', status: 'todo', memo: '', children: [] };
    setTreeFor(section, (prev) => [...prev, node]);
    setExpandedIds((prev) => new Set(prev).add(node.id));
  };

  const doReset = (section) => {
    if (section === 'mission') setMissionTree(deepClone(MISSION_SEED));
    else setExecTree(deepClone(EXEC_SEED));
    setResetConfirm(null);
  };

  const openDetail = (section, id) => { setActiveSection(section); setActiveId(id); setView('detail'); };
  const backToList = () => { setView('list'); setActiveId(null); setActiveSection(null); };

  if (!loaded) {
    return (
      <div style={{ minHeight: 400, display: 'flex', alignItems: 'center', justifyContent: 'center', background: C.bg, fontFamily: "'Noto Sans KR', sans-serif", color: C.inkSoft, fontSize: 13 }}>
        불러오는 중…
      </div>
    );
  }

  const q = query.trim().toLowerCase();
  const activeTree = activeSection ? treeFor(activeSection) : null;
  const activeNode = activeTree && activeId ? activeTree.find((n) => n.id === activeId) : null;
  const activeIndex = activeTree && activeId ? activeTree.findIndex((n) => n.id === activeId) : -1;
  const effectiveView = (view === 'detail' && !activeNode) ? 'list' : view;

  return (
    <div style={{ background: C.bg, minHeight: '100%', fontFamily: "'Noto Sans KR', sans-serif", color: C.ink }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        .node-row:hover { background: ${C.cardAlt}; }
        .node-actions button:hover { background: ${C.borderSoft}; }
        .list-card:hover { border-color: ${C.coral}; box-shadow: 0 2px 8px rgba(44,38,32,0.06); }
        input, textarea { font-family: 'Noto Sans KR', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: ${C.border}; border-radius: 8px; }
        .top-add-btn:hover { background: ${C.bgSoft}; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: start; }
        .right-col { border-left: 1px solid ${C.border}; padding-left: 30px; }
        @media (max-width: 720px) {
          .two-col { grid-template-columns: 1fr; gap: 0; }
          .right-col { border-left: none; padding-left: 0; border-top: 1px solid ${C.border}; padding-top: 22px; margin-top: 4px; }
        }
      `}</style>

      <div style={{ maxWidth: 1040, margin: '0 auto', padding: '28px 18px 60px' }}>
        {/* 헤더 */}
        <div style={{ marginBottom: 22 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 6 }}>
            <div style={{
              width: 34, height: 34, borderRadius: 10, background: C.coral,
              display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
            }}>
              <Compass size={18} color="#FFF" strokeWidth={2} />
            </div>
            <div>
              <h1 style={{
                fontFamily: "'Noto Serif KR', serif", fontWeight: 700, fontSize: 21,
                margin: 0, color: C.ink, letterSpacing: '-0.01em',
              }}>
                비엠하우스 사업 소명과 실행 기획
              </h1>
              <div style={{ fontSize: 12, color: C.inkSoft, marginTop: 2 }}>
                생명을 살리고 돌보는 일 — 소명에서 실행까지, 언제든 기록하는 대시보드
              </div>
            </div>
          </div>
          <div style={{ fontSize: 11, color: C.inkFaint, marginLeft: 44 }}>
            {saveState === 'saving' ? '저장 중…' : lastSaved ? '마지막 기록 · ' + formatRelative(lastSaved) : '아직 기록 없음'}
          </div>
        </div>

        {effectiveView === 'detail' && activeNode ? (
          <DetailView
            node={activeNode}
            showStatus={activeSection === 'exec'}
            expandedIds={expandedIds}
            toggleExpand={toggleExpand}
            onEditText={(id, text) => onEditText(activeSection, id, text)}
            onEditMemo={(id, memo) => onEditMemo(activeSection, id, memo)}
            onCycleStatus={(id) => onCycleStatus(activeSection, id)}
            onAddChild={(id) => onAddChild(activeSection, id)}
            onDelete={(id) => onDelete(activeSection, id)}
            onBack={backToList}
            accent={ACCENTS[Math.max(activeIndex, 0) % ACCENTS.length]}
          />
        ) : (
          <>
            {/* 전체 검색 (두 섹션 공통) */}
            <div style={{ position: 'relative', marginBottom: 20 }}>
              <Search size={14} color={C.inkFaint} style={{ position: 'absolute', left: 11, top: 11 }} />
              <input
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="제목·하위 내용·메모 검색"
                style={{
                  width: '100%', padding: '9px 10px 9px 32px', borderRadius: 10,
                  border: '1px solid ' + C.border, background: C.card, fontSize: 13, outline: 'none', color: C.ink,
                }}
              />
            </div>

            {/* 소명과 가치(왼쪽) / 실행 계획(오른쪽) */}
            <div className="two-col">
              <div>
                <SectionBlock
                  title="소명과 가치"
                  icon={<Sparkles size={14} />}
                  tree={missionTree}
                  sectionKey="mission"
                  showStatus={false}
                  inline={true}
                  accentOffset={0}
                  onOpen={openDetail}
                  onAddTop={onAddTop}
                  onReset={doReset}
                  resetConfirm={resetConfirm}
                  setResetConfirm={setResetConfirm}
                  query={query}
                  expandedIds={expandedIds}
                  toggleExpand={toggleExpand}
                  onEditText={(id, text) => onEditText('mission', id, text)}
                  onEditMemo={(id, memo) => onEditMemo('mission', id, memo)}
                  onCycleStatus={(id) => onCycleStatus('mission', id)}
                  onAddChild={(id) => onAddChild('mission', id)}
                  onDelete={(id) => onDelete('mission', id)}
                />
              </div>

              <div className="right-col">
                <SectionBlock
                  title="실행 계획"
                  icon={<CheckCircle2 size={14} />}
                  tree={execTree}
                  sectionKey="exec"
                  showStatus={true}
                  inline={false}
                  accentOffset={1}
                  onOpen={openDetail}
                  onAddTop={onAddTop}
                  onReset={doReset}
                  resetConfirm={resetConfirm}
                  setResetConfirm={setResetConfirm}
                  query={query}
                />
              </div>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
